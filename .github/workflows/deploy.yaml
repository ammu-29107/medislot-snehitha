name: MediSlot CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'config.json'
      - 'README.md'
      - 'cloudformation/**'
      - '.github/workflows/**'
      - 'database/schema.sql'
      - 'src/database/**'
      - 'src/auth/**'
  push:
    branches:
      - milestone-2
    paths:
      - 'config.json'
      - 'README.md'
      - 'cloudformation/**'
      - '.github/workflows/**'
      - 'database/schema.sql'
      - 'src/database/**'
      - 'src/auth/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration, infrastructure, and security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate config.json
        run: jq empty config.json

      - name: Validate CloudFormation templates
        run: |
          pip install cfn-lint
          cfn-lint cloudformation/network.yaml cloudformation/data.yaml cloudformation/auth.yaml --ignore-checks W1011


  deploy-network:
    name: Deploy network stack
    if: github.ref == 'refs/heads/milestone-2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read deployment configuration
        id: config
        shell: bash
        run: |
          echo "region=$(jq -r '.AWSRegion' config.json)" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r '.Environment' config.json)" >> "$GITHUB_OUTPUT"
          echo "stack_prefix=$(jq -r '.StackPrefix' config.json)" >> "$GITHUB_OUTPUT"
          echo "project_name=$(jq -r '.ProjectName' config.json)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy network stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network.yaml \
            --stack-name "${{ steps.config.outputs.stack_prefix }}-network" \
            --parameter-overrides \
              ProjectName="$(jq -r '.ProjectName' config.json)" \
              Environment="$(jq -r '.Environment' config.json)" \
              VpcCidr="$(jq -r '.VpcCidr' config.json)" \
              PublicSubnetCidr="$(jq -r '.PublicSubnetCidr' config.json)" \
              PrivateSubnetACidr="$(jq -r '.PrivateSubnetACidr' config.json)" \
              PrivateSubnetBCidr="$(jq -r '.PrivateSubnetBCidr' config.json)" \
            --region "${{ steps.config.outputs.region }}" \
            --no-fail-on-empty-changeset

  deploy-data:
    name: Deploy database and data resources
    if: github.ref == 'refs/heads/milestone-2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deploy-network
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read deployment configuration
        id: config
        shell: bash
        run: |
          echo "region=$(jq -r '.AWSRegion' config.json)" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r '.Environment' config.json)" >> "$GITHUB_OUTPUT"
          echo "stack_prefix=$(jq -r '.StackPrefix' config.json)" >> "$GITHUB_OUTPUT"
          echo "project_name=$(jq -r '.ProjectName' config.json)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision database password in SSM
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
        run: |
          set -euo pipefail

          if [[ -z "$DB_PASSWORD" ]]; then
            echo "DB_PASSWORD GitHub secret is missing."
            exit 1
          fi

          aws ssm put-parameter \
            --name "/${PROJECT_NAME}/${ENVIRONMENT}/database/password" \
            --type SecureString \
            --value "$DB_PASSWORD" \
            --overwrite

      - name: Deploy data stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data.yaml \
            --stack-name "${{ steps.config.outputs.stack_prefix }}-data" \
            --parameter-overrides \
              ProjectName="$(jq -r '.ProjectName' config.json)" \
              Environment="$(jq -r '.Environment' config.json)" \
            --region "${{ steps.config.outputs.region }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Package schema migration Lambda
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/schema-apply-package"
          mkdir -p "$PACKAGE_DIR"

          python -m pip install \
            --disable-pip-version-check \
            -r src/database/requirements.txt \
            --target "$PACKAGE_DIR"

          cp src/database/schema_apply.py "$PACKAGE_DIR/schema_apply.py"
          cp database/schema.sql "$PACKAGE_DIR/schema.sql"

          (
            cd "$PACKAGE_DIR"
            zip -qr "$RUNNER_TEMP/schema-apply.zip" .
          )

      - name: Upload schema migration package
        id: migration
        shell: bash
        env:
          STACK_PREFIX: ${{ steps.config.outputs.stack_prefix }}
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ARTIFACTS_BUCKET="${STACK_PREFIX}-${ACCOUNT_ID}-artifacts"
          MIGRATION_KEY="schema-apply/schema-apply-${GITHUB_SHA}.zip"

          aws s3 cp "$RUNNER_TEMP/schema-apply.zip" \
            "s3://${ARTIFACTS_BUCKET}/${MIGRATION_KEY}"

          echo "migration_code_key=${MIGRATION_KEY}" >> "$GITHUB_OUTPUT"

      - name: Wait for RDS to become available
        shell: bash
        env:
          REGION: ${{ steps.config.outputs.region }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
        run: |
          set -euo pipefail

          aws rds wait db-instance-available \
            --db-instance-identifier "${PROJECT_NAME}-${ENVIRONMENT}-mysql" \
            --region "$REGION"

      - name: Create or update schema migration Lambda
        shell: bash
        env:
          REGION: ${{ steps.config.outputs.region }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          STACK_PREFIX: ${{ steps.config.outputs.stack_prefix }}
          MIGRATION_KEY: ${{ steps.migration.outputs.migration_code_key }}
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          STACK_NAME="${STACK_PREFIX}-data"
          FUNCTION_NAME="${PROJECT_NAME}-${ENVIRONMENT}-schema-apply"
          ROLE_NAME="${PROJECT_NAME}-${ENVIRONMENT}-schema-apply-role"
          ARTIFACTS_BUCKET="${STACK_PREFIX}-${ACCOUNT_ID}-artifacts"

          get_export() {
            local export_name="$1"
            aws cloudformation list-exports \
              --region "$REGION" \
              --query "Exports[?Name=='${export_name}'].Value | [0]" \
              --output text
          }

          DB_HOST="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue | [0]" \
            --output text)"

          DB_PORT="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabasePort'].OutputValue | [0]" \
            --output text)"

          DB_USER="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseUsername'].OutputValue | [0]" \
            --output text)"

          LAMBDA_SG="$(get_export "${PROJECT_NAME}-${ENVIRONMENT}-LambdaSecurityGroupId")"
          SUBNET_A="$(get_export "${PROJECT_NAME}-${ENVIRONMENT}-PrivateSubnetAId")"
          SUBNET_B="$(get_export "${PROJECT_NAME}-${ENVIRONMENT}-PrivateSubnetBId")"

          for value in "$DB_HOST" "$DB_PORT" "$DB_USER" "$LAMBDA_SG" "$SUBNET_A" "$SUBNET_B"; do
            if [[ -z "$value" || "$value" == "None" ]]; then
              echo "A required database output or network export is missing."
              exit 1
            fi
          done

          cat > "$RUNNER_TEMP/lambda-trust.json" <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Service": "lambda.amazonaws.com"},
              "Action": "sts:AssumeRole"
            }]
          }
          JSON

          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            aws iam create-role \
              --role-name "$ROLE_NAME" \
              --assume-role-policy-document "file://$RUNNER_TEMP/lambda-trust.json"
          fi

          aws iam update-assume-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-document "file://$RUNNER_TEMP/lambda-trust.json"

          cat > "$RUNNER_TEMP/lambda-policy.json" <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "logs:CreateLogGroup",
                  "logs:CreateLogStream",
                  "logs:PutLogEvents"
                ],
                "Resource": "*"
              },
              {
                "Effect": "Allow",
                "Action": [
                  "ec2:CreateNetworkInterface",
                  "ec2:DescribeNetworkInterfaces",
                  "ec2:DescribeSubnets",
                  "ec2:DeleteNetworkInterface",
                  "ec2:AssignPrivateIpAddresses",
                  "ec2:UnassignPrivateIpAddresses"
                ],
                "Resource": "*"
              },
              {
                "Effect": "Allow",
                "Action": "ssm:GetParameter",
                "Resource": "arn:aws:ssm:${REGION}:${ACCOUNT_ID}:parameter/${PROJECT_NAME}/${ENVIRONMENT}/database/password"
              }
            ]
          }
          JSON

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name SchemaApplyRuntimeAccess \
            --policy-document "file://$RUNNER_TEMP/lambda-policy.json"

          ROLE_ARN="$(aws iam get-role \
            --role-name "$ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)"

          ENVIRONMENT_JSON="$(jq -n \
            --arg host "$DB_HOST" \
            --arg port "$DB_PORT" \
            --arg user "$DB_USER" \
            --arg parameter "/${PROJECT_NAME}/${ENVIRONMENT}/database/password" \
            '{
              Variables: {
                DB_HOST: $host,
                DB_PORT: $port,
                DB_NAME: "medislot",
                DB_USER: $user,
                DB_PASSWORD_PARAMETER: $parameter
              }
            }')"

          sleep 10

          if aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$REGION" >/dev/null 2>&1; then

            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --s3-bucket "$ARTIFACTS_BUCKET" \
              --s3-key "$MIGRATION_KEY" \
              --region "$REGION"

            aws lambda wait function-updated-v2 \
              --function-name "$FUNCTION_NAME" \
              --region "$REGION"

            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --role "$ROLE_ARN" \
              --timeout 120 \
              --memory-size 256 \
              --vpc-config "SubnetIds=${SUBNET_A},${SUBNET_B},SecurityGroupIds=${LAMBDA_SG}" \
              --environment "$ENVIRONMENT_JSON" \
              --region "$REGION"

            aws lambda wait function-updated-v2 \
              --function-name "$FUNCTION_NAME" \
              --region "$REGION"
          else
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime python3.12 \
              --handler schema_apply.handler \
              --role "$ROLE_ARN" \
              --timeout 120 \
              --memory-size 256 \
              --code "S3Bucket=${ARTIFACTS_BUCKET},S3Key=${MIGRATION_KEY}" \
              --vpc-config "SubnetIds=${SUBNET_A},${SUBNET_B},SecurityGroupIds=${LAMBDA_SG}" \
              --environment "$ENVIRONMENT_JSON" \
              --region "$REGION"

            aws lambda wait function-active-v2 \
              --function-name "$FUNCTION_NAME" \
              --region "$REGION"
          fi

          echo "Schema migration Lambda is ready."

      - name: Apply database schema
        shell: bash
        env:
          REGION: ${{ steps.config.outputs.region }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="${PROJECT_NAME}-${ENVIRONMENT}-schema-apply"
          RESPONSE_FILE="$RUNNER_TEMP/schema-response.json"

          for attempt in 1 2 3 4 5; do
            echo "Schema migration attempt ${attempt}/5"

            if aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --invocation-type RequestResponse \
              --payload '{}' \
              --cli-binary-format raw-in-base64-out \
              --region "$REGION" \
              "$RESPONSE_FILE" \
              > "$RUNNER_TEMP/schema-invoke-metadata.json"; then

              if jq -e '.FunctionError == null' \
                "$RUNNER_TEMP/schema-invoke-metadata.json" > /dev/null \
                && jq -e '.status == "SUCCESS"' "$RESPONSE_FILE" > /dev/null; then
                cat "$RESPONSE_FILE"
                echo "Database schema applied successfully."
                exit 0
              fi
            fi

            cat "$RESPONSE_FILE" 2>/dev/null || true
            sleep 10
          done

          echo "Schema migration failed after five attempts."
          exit 1

  deploy-auth:
    name: Package and deploy authentication API
    if: github.ref == 'refs/heads/milestone-2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deploy-data
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read deployment configuration
        id: config
        shell: bash
        run: |
          echo "region=$(jq -r '.AWSRegion' config.json)" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r '.Environment' config.json)" >> "$GITHUB_OUTPUT"
          echo "stack_prefix=$(jq -r '.StackPrefix' config.json)" >> "$GITHUB_OUTPUT"
          echo "project_name=$(jq -r '.ProjectName' config.json)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Provision runtime secrets in SSM
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SIGNING_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
        run: |
          set -euo pipefail

          if [[ -z "$DB_PASSWORD" ]]; then
            echo "DB_PASSWORD GitHub secret is missing."
            exit 1
          fi

          if [[ -z "$JWT_SIGNING_SECRET" ]]; then
            echo "JWT_SIGNING_SECRET GitHub secret is missing."
            exit 1
          fi

          aws ssm put-parameter \
            --name "/${PROJECT_NAME}/${ENVIRONMENT}/database/password" \
            --type SecureString \
            --value "$DB_PASSWORD" \
            --overwrite

          aws ssm put-parameter \
            --name "/${PROJECT_NAME}/${ENVIRONMENT}/auth/jwt-signing-secret" \
            --type SecureString \
            --value "$JWT_SIGNING_SECRET" \
            --overwrite

          echo "Runtime secret parameters provisioned."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package registration Lambda
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/register-package"
          mkdir -p "$PACKAGE_DIR"

          python -m pip install \
            --disable-pip-version-check \
            -r src/auth/register/requirements.txt \
            --target "$PACKAGE_DIR"

          cp src/auth/register/app.py "$PACKAGE_DIR/app.py"

          (
            cd "$PACKAGE_DIR"
            zip -qr "$RUNNER_TEMP/register.zip" .
          )

      - name: Package login Lambda
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/login-package"
          mkdir -p "$PACKAGE_DIR"

          python -m pip install \
            --disable-pip-version-check \
            -r src/auth/login/requirements.txt \
            --target "$PACKAGE_DIR"

          cp src/auth/login/app.py "$PACKAGE_DIR/app.py"

          (
            cd "$PACKAGE_DIR"
            zip -qr "$RUNNER_TEMP/login.zip" .
          )

      - name: Package authorizer Lambda
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/authorizer-package"
          mkdir -p "$PACKAGE_DIR"

          python -m pip install \
            --disable-pip-version-check \
            -r src/auth/authorizer/requirements.txt \
            --target "$PACKAGE_DIR"

          cp src/auth/authorizer/app.py "$PACKAGE_DIR/app.py"

          (
            cd "$PACKAGE_DIR"
            zip -qr "$RUNNER_TEMP/authorizer.zip" .
          )

      - name: Package profile Lambda
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/profile-package"
          mkdir -p "$PACKAGE_DIR"

          python -m pip install \
            --disable-pip-version-check \
            -r src/auth/profile/requirements.txt \
            --target "$PACKAGE_DIR"

          cp src/auth/profile/app.py "$PACKAGE_DIR/app.py"

          (
            cd "$PACKAGE_DIR"
            zip -qr "$RUNNER_TEMP/profile.zip" .
          )

      - name: Package refresh Lambda
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/refresh-package"
          mkdir -p "$PACKAGE_DIR"

          python -m pip install \
            --disable-pip-version-check \
            -r src/auth/refresh/requirements.txt \
            --target "$PACKAGE_DIR"

          cp src/auth/refresh/app.py "$PACKAGE_DIR/app.py"

          (
            cd "$PACKAGE_DIR"
            zip -qr "$RUNNER_TEMP/refresh.zip" .
          )

      - name: Package logout Lambda
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/logout-package"
          mkdir -p "$PACKAGE_DIR"

          python -m pip install \
            --disable-pip-version-check \
            -r src/auth/logout/requirements.txt \
            --target "$PACKAGE_DIR"

          cp src/auth/logout/app.py "$PACKAGE_DIR/app.py"

          (
            cd "$PACKAGE_DIR"
            zip -qr "$RUNNER_TEMP/logout.zip" .
          )

      - name: Read deployed data-stack outputs
        id: data
        shell: bash
        env:
          STACK_PREFIX: ${{ steps.config.outputs.stack_prefix }}
        run: |
          set -euo pipefail

          STACK_NAME="${STACK_PREFIX}-data"

          get_output() {
            local key="$1"
            local value

            value="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='${key}'].OutputValue | [0]" \
              --output text)"

            if [[ -z "$value" || "$value" == "None" ]]; then
              echo "Required data-stack output is missing: ${key}" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          echo "database_host=$(get_output DatabaseEndpoint)" >> "$GITHUB_OUTPUT"
          echo "database_username=$(get_output DatabaseUsername)" >> "$GITHUB_OUTPUT"
          echo "refresh_tokens_table=$(get_output RefreshTokensTableName)" >> "$GITHUB_OUTPUT"
          echo "access_tokens_table=$(get_output AccessTokensTableName)" >> "$GITHUB_OUTPUT"
          echo "artifacts_bucket=$(get_output DeploymentArtifactsBucketName)" >> "$GITHUB_OUTPUT"

      - name: Upload Lambda packages to S3
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ steps.data.outputs.artifacts_bucket }}
        run: |
          set -euo pipefail

          REGISTER_KEY="lambda/auth/register-${GITHUB_SHA}.zip"
          LOGIN_KEY="lambda/auth/login-${GITHUB_SHA}.zip"
          AUTHORIZER_KEY="lambda/auth/authorizer-${GITHUB_SHA}.zip"
          PROFILE_KEY="lambda/auth/profile-${GITHUB_SHA}.zip"
          REFRESH_KEY="lambda/auth/refresh-${GITHUB_SHA}.zip"
          LOGOUT_KEY="lambda/auth/logout-${GITHUB_SHA}.zip"

          aws s3 cp "$RUNNER_TEMP/register.zip" \
            "s3://${ARTIFACTS_BUCKET}/${REGISTER_KEY}"

          aws s3 cp "$RUNNER_TEMP/login.zip" \
            "s3://${ARTIFACTS_BUCKET}/${LOGIN_KEY}"

          aws s3 cp "$RUNNER_TEMP/authorizer.zip" \
            "s3://${ARTIFACTS_BUCKET}/${AUTHORIZER_KEY}"

          aws s3 cp "$RUNNER_TEMP/profile.zip" \
            "s3://${ARTIFACTS_BUCKET}/${PROFILE_KEY}"

          aws s3 cp "$RUNNER_TEMP/refresh.zip" \
            "s3://${ARTIFACTS_BUCKET}/${REFRESH_KEY}"

          aws s3 cp "$RUNNER_TEMP/logout.zip" \
            "s3://${ARTIFACTS_BUCKET}/${LOGOUT_KEY}"

          echo "register_key=${REGISTER_KEY}" >> "$GITHUB_ENV"
          echo "login_key=${LOGIN_KEY}" >> "$GITHUB_ENV"
          echo "authorizer_key=${AUTHORIZER_KEY}" >> "$GITHUB_ENV"
          echo "profile_key=${PROFILE_KEY}" >> "$GITHUB_ENV"
          echo "refresh_key=${REFRESH_KEY}" >> "$GITHUB_ENV"
          echo "logout_key=${LOGOUT_KEY}" >> "$GITHUB_ENV"

      - name: Deploy authentication stack
        shell: bash
        env:
          REGION: ${{ steps.config.outputs.region }}
          STACK_PREFIX: ${{ steps.config.outputs.stack_prefix }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          ARTIFACTS_BUCKET: ${{ steps.data.outputs.artifacts_bucket }}
          DATABASE_HOST: ${{ steps.data.outputs.database_host }}
          DATABASE_USERNAME: ${{ steps.data.outputs.database_username }}
          REFRESH_TOKENS_TABLE: ${{ steps.data.outputs.refresh_tokens_table }}
          ACCESS_TOKENS_TABLE: ${{ steps.data.outputs.access_tokens_table }}
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file cloudformation/auth.yaml \
            --stack-name "${STACK_PREFIX}-auth" \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              Environment="$ENVIRONMENT" \
              NetworkStackName="${STACK_PREFIX}" \
              ArtifactsBucketName="$ARTIFACTS_BUCKET" \
              RegisterCodeKey="$register_key" \
              LoginCodeKey="$login_key" \
              AuthorizerCodeKey="$authorizer_key" \
              ProfileCodeKey="$profile_key" \
              RefreshCodeKey="$refresh_key" \
              LogoutCodeKey="$logout_key" \
              RefreshTokensTableName="$REFRESH_TOKENS_TABLE" \
              DatabaseUsername="$DATABASE_USERNAME" \
              DatabaseHost="$DATABASE_HOST" \
              AccessTokensTableName="$ACCESS_TOKENS_TABLE" \
            --region "$REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
