
AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot doctor profile and scheduling APIs

Parameters:
  ProjectName:
    Type: String
  Environment:
    Type: String
  NetworkStackName:
    Type: String
  ArtifactsBucketName:
    Type: String
  PrivateFilesBucketName:
    Type: String
  DatabaseHost:
    Type: String
  DatabaseUsername:
    Type: String

  DoctorProfileCodeKey:
    Type: String
  ConsultationTypesCodeKey:
    Type: String
  SchedulingCodeKey:
    Type: String
  DayViewCodeKey:
    Type: String
  SlotMaintenanceCodeKey:
    Type: String

Resources:

  # --------------------------------------------------
  # IAM ROLES
  # --------------------------------------------------

  DoctorProfileExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: DoctorProfileRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/database/password'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${PrivateFilesBucketName}/doctor-profiles/*'

  ConsultationTypesExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: ConsultationTypesDatabaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/database/password'

  SchedulingExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: SchedulingDatabaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/database/password'

  DayViewExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: DayViewDatabaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/database/password'

  SlotMaintenanceExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: SlotMaintenanceDatabaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/database/password'

  # --------------------------------------------------
  # LAMBDA FUNCTIONS
  # --------------------------------------------------

  DoctorProfileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-doctor-profile'
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt DoctorProfileExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref DoctorProfileCodeKey
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetAId'
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetBId'
      Environment:
        Variables:
          DB_HOST: !Ref DatabaseHost
          DB_PORT: '3306'
          DB_NAME: medislot
          DB_USER: !Ref DatabaseUsername
          DB_PASSWORD_PARAMETER: !Sub '/${ProjectName}/${Environment}/database/password'
          PRIVATE_FILES_BUCKET: !Ref PrivateFilesBucketName
          LOG_LEVEL: INFO

  ConsultationTypesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-consultation-types'
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt ConsultationTypesExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref ConsultationTypesCodeKey
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetAId'
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetBId'
      Environment:
        Variables:
          DB_HOST: !Ref DatabaseHost
          DB_PORT: '3306'
          DB_NAME: medislot
          DB_USER: !Ref DatabaseUsername
          DB_PASSWORD_PARAMETER: !Sub '/${ProjectName}/${Environment}/database/password'
          LOG_LEVEL: INFO

  SchedulingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-scheduling'
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt SchedulingExecutionRole.Arn
      Timeout: 20
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref SchedulingCodeKey
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetAId'
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetBId'
      Environment:
        Variables:
          DB_HOST: !Ref DatabaseHost
          DB_PORT: '3306'
          DB_NAME: medislot
          DB_USER: !Ref DatabaseUsername
          DB_PASSWORD_PARAMETER: !Sub '/${ProjectName}/${Environment}/database/password'
          LOG_LEVEL: INFO

  DayViewFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-doctor-day-view'
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt DayViewExecutionRole.Arn
      Timeout: 20
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref DayViewCodeKey
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetAId'
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetBId'
      Environment:
        Variables:
          DB_HOST: !Ref DatabaseHost
          DB_PORT: '3306'
          DB_NAME: medislot
          DB_USER: !Ref DatabaseUsername
          DB_PASSWORD_PARAMETER: !Sub '/${ProjectName}/${Environment}/database/password'
          LOG_LEVEL: INFO

  SlotMaintenanceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-slot-maintenance'
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt SlotMaintenanceExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactsBucketName
        S3Key: !Ref SlotMaintenanceCodeKey
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetAId'
          - Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetBId'
      Environment:
        Variables:
          DB_HOST: !Ref DatabaseHost
          DB_PORT: '3306'
          DB_NAME: medislot
          DB_USER: !Ref DatabaseUsername
          DB_PASSWORD_PARAMETER: !Sub '/${ProjectName}/${Environment}/database/password'
          LOG_LEVEL: INFO

  # --------------------------------------------------
  # EXISTING HTTP API REFERENCES
  # --------------------------------------------------

  # The API and authorizer are owned by the auth stack.
  # This stack only adds integrations and routes.

  DoctorProfileIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt DoctorProfileFunction.Arn
      PayloadFormatVersion: '2.0'

  ConsultationTypesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt ConsultationTypesFunction.Arn
      PayloadFormatVersion: '2.0'

  SchedulingIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt SchedulingFunction.Arn
      PayloadFormatVersion: '2.0'

  DayViewIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt DayViewFunction.Arn
      PayloadFormatVersion: '2.0'

  # --------------------------------------------------
  # AUTHENTICATED HTTP API ROUTES
  # --------------------------------------------------

  DoctorProfileGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'GET /doctor/profile'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${DoctorProfileIntegration}'

  DoctorProfilePutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'PUT /doctor/profile'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${DoctorProfileIntegration}'

  ConsultationTypesGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'GET /doctor/consultation-types'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${ConsultationTypesIntegration}'

  ConsultationTypesPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'POST /doctor/consultation-types'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${ConsultationTypesIntegration}'

  ConsultationTypesPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'PUT /doctor/consultation-types/{consultationTypeId}'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${ConsultationTypesIntegration}'

  ConsultationTypesDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'DELETE /doctor/consultation-types/{consultationTypeId}'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${ConsultationTypesIntegration}'

  SlotsGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'GET /doctor/slots'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${SchedulingIntegration}'

  SlotsPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'POST /doctor/slots'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${SchedulingIntegration}'

  BlackoutDatesGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'GET /doctor/blackout-dates'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${SchedulingIntegration}'

  BlackoutDatesPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'POST /doctor/blackout-dates'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${SchedulingIntegration}'

  DoctorDayViewGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'
      RouteKey: 'GET /doctor/day-view'
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Environment}-AuthAuthorizerId'
      Target: !Sub 'integrations/${DayViewIntegration}'

  # --------------------------------------------------
  # API GATEWAY LAMBDA PERMISSIONS
  # --------------------------------------------------

  DoctorProfileApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DoctorProfileFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/doctor/profile'
          - ApiId:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'

  ConsultationTypesApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConsultationTypesFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/doctor/consultation-types*'
          - ApiId:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'

  SchedulingApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SchedulingFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/doctor/*'
          - ApiId:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'

  DayViewApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DayViewFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub:
          - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/doctor/day-view'
          - ApiId:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Environment}-AuthApiId'

  # --------------------------------------------------
  # EVENTBRIDGE SCHEDULER
  # --------------------------------------------------

  SlotMaintenanceScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSlotMaintenance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SlotMaintenanceFunction.Arn

  SlotMaintenanceSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-slot-maintenance'
      Description: Periodically updates expired doctor slots
      State: ENABLED
      ScheduleExpression: rate(1 hour)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt SlotMaintenanceFunction.Arn
        RoleArn: !GetAtt SlotMaintenanceScheduleRole.Arn
        Input: '{}'

Outputs:
  DoctorProfileFunctionName:
    Value: !Ref DoctorProfileFunction

  ConsultationTypesFunctionName:
    Value: !Ref ConsultationTypesFunction

  SchedulingFunctionName:
    Value: !Ref SchedulingFunction

  DayViewFunctionName:
    Value: !Ref DayViewFunction

  SlotMaintenanceFunctionName:
    Value: !Ref SlotMaintenanceFunction
