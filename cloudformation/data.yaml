
AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot development data infrastructure

Parameters:
  ProjectName:
    Type: String
    Default: medislot
  Environment:
    Type: String
    Default: dev
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  DBUsername:
    Type: String
    Default: medislotadmin
    MinLength: 1
    MaxLength: 16
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 41
    Description: Supply securely at deployment time; never commit a real password.
  MigrationCodeKey:
    Type: String
    Description: S3 key for the packaged schema migration Lambda ZIP

Resources:
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for MediSlot MySQL
      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: '${ProjectName}-${Environment}-PrivateSubnetAId'
        - Fn::ImportValue:
            Fn::Sub: '${ProjectName}-${Environment}-PrivateSubnetBId'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  MediSlotDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-${Environment}-mysql'
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: medislot
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: '${ProjectName}-${Environment}-DatabaseSecurityGroupId'
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  SchemaApplyExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-schema-apply-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SchemaApplyRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

              - Sid: ManageLambdaNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'

              - Sid: ReadDatabasePassword
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/database/password'

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  SchemaApplyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-schema-apply'
      Runtime: python3.12
      Handler: schema_apply.handler
      Role: !GetAtt SchemaApplyExecutionRole.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref DeploymentArtifactsBucket
        S3Key: !Ref MigrationCodeKey
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: '${ProjectName}-${Environment}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: '${ProjectName}-${Environment}-PrivateSubnetAId'
          - Fn::ImportValue:
              Fn::Sub: '${ProjectName}-${Environment}-PrivateSubnetBId'
      Environment:
        Variables:
          DB_HOST: !GetAtt MediSlotDatabase.Endpoint.Address
          DB_PORT: !GetAtt MediSlotDatabase.Endpoint.Port
          DB_NAME: medislot
          DB_USER: !Ref DBUsername
          DB_PASSWORD_PARAMETER: !Sub '/${ProjectName}/${Environment}/database/password'

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  SlotInventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-slot-inventory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  IdempotencyKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-idempotency-keys'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiryTimestamp
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  TokenRevocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-token-revocations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S
      KeySchema:
        - AttributeName: jti
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiryTimestamp
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-refresh-tokens'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiryTimestamp
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  NotificationDispatchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-notification-dispatch'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: notificationId
          AttributeType: S
      KeySchema:
        - AttributeName: notificationId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  PrivateFilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-private-files'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  DeploymentArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-artifacts'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  DatabaseEndpoint:
    Description: Private MySQL endpoint
    Value: !GetAtt MediSlotDatabase.Endpoint.Address
  DatabaseUsername:
    Description: Username configured for the MediSlot database
    Value: !Ref DBUsername
  DatabasePort:
    Value: !GetAtt MediSlotDatabase.Endpoint.Port
  SlotInventoryTableName:
    Value: !Ref SlotInventoryTable
  IdempotencyKeysTableName:
    Value: !Ref IdempotencyKeysTable
  TokenRevocationsTableName:
    Value: !Ref TokenRevocationsTable
  RefreshTokensTableName:
    Description: DynamoDB table for hashed refresh-token records
    Value: !Ref RefreshTokensTable
  NotificationDispatchTableName:
    Value: !Ref NotificationDispatchTable
  PrivateFilesBucketName:
    Value: !Ref PrivateFilesBucket
  DeploymentArtifactsBucketName:
    Value: !Ref DeploymentArtifactsBucket
